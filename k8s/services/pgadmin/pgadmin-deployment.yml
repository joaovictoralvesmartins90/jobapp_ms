apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  labels:
    app: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9
          ports:
            - containerPort: 80
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: pgadmin-config
                  key: PGADMIN_DEFAULT_EMAIL
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: pgadmin-config
                  key: PGADMIN_DEFAULT_PASSWORD
            - name: PGADMIN_CONFIG_SERVER_MODE
              valueFrom:
                configMapKeyRef:
                  name: pgadmin-config
                  key: PGADMIN_CONFIG_SERVER_MODE
          volumeMounts:
            # subPath monta só o arquivo, sem esconder o resto de /pgadmin4
            - name: config
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
            # emptyDir: os dados do pgAdmin se perdem quando o pod é recriado
            - name: data
              mountPath: /var/lib/pgadmin
      volumes:
        - name: config
          configMap:
            name: pgadmin-config
        - name: data
          emptyDir: {}
