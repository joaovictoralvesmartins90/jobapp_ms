apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # substitui o depends_on do compose: só inicia a aplicação quando as dependências aceitam conexão
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for dep in company-service:8081 job-service:8082 review-service:8083; do
                until nc -z -w 2 ${dep%:*} ${dep#*:}; do echo "aguardando $dep"; sleep 2; done
              done
      containers:
        - name: api-gateway
          # imagem construída localmente e carregada no Minikube (minikube image load)
          image: jobapp/api-gateway:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          env:
            # o profile docker já aponta para postgres, rabbitmq, service-registry etc.,
            # que são os mesmos nomes dos Services do Kubernetes
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            # heap da JVM proporcional ao limite de memória do container
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
            # habilita /actuator/health/liveness e /readiness mesmo fora da detecção automática de Kubernetes
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          # startupProbe dá até 3 min para a JVM subir; liveness/readiness só começam depois
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            periodSeconds: 10
            failureThreshold: 3
