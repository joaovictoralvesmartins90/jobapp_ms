#eureka
eureka.client.serviceUrl.defaultZone=http://service-registry:8084/eureka/
eureka.instance.prefer-ip-address=true

#telemetry
management.opentelemetry.tracing.export.otlp.endpoint=http://otel-collector:4318/v1/traces
management.otlp.metrics.export.url=http://otel-collector:4318/v1/metrics

#rotas
# Listas nao sao mescladas entre arquivos: quando o profile redefine routes[...],
# a lista inteira do application.properties e substituida. Por isso todas as rotas
# estao repetidas aqui, so trocando localhost pelo nome do servico no compose.
spring.cloud.gateway.server.webmvc.routes[0].id=company-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://company-service:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/companies,/companies/*
spring.cloud.gateway.server.webmvc.routes[1].id=job-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://job-service:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/companies/*/jobs/**
spring.cloud.gateway.server.webmvc.routes[2].id=review-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://review-service:8083
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/companies/*/reviews/**
#actuator dos servicos
spring.cloud.gateway.server.webmvc.routes[3].id=company-service-actuator
spring.cloud.gateway.server.webmvc.routes[3].uri=http://company-service:8081
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/company-service/actuator/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webmvc.routes[4].id=job-service-actuator
spring.cloud.gateway.server.webmvc.routes[4].uri=http://job-service:8082
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/job-service/actuator/**
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webmvc.routes[5].id=review-service-actuator
spring.cloud.gateway.server.webmvc.routes[5].uri=http://review-service:8083
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/review-service/actuator/**
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=StripPrefix=1
